<?php if ($formModel && $formModel->exists && $formModel->form_id): ?>
<?php $uploaderUrl = url('/mercator/uploader/default/' . $formModel->form_id); ?>
<div style="margin-top: 4px;">
    <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 8px;">
        <input type="text" value="<?= e($uploaderUrl) ?>" readonly id="uploaderlink-<?= $formModel->id ?>"
               style="flex: 1; font-family: monospace; font-size: .82rem; padding: 6px 10px;
                      border: 1px solid #ddd; border-radius: 4px; background: #f9f9f9; color: #333;">
        <button type="button" class="btn btn-default btn-sm"
                onclick="(function(b){
                    navigator.clipboard && navigator.clipboard.writeText(document.getElementById('uploaderlink-<?= $formModel->id ?>').value);
                    b.textContent = 'Copied!';
                    setTimeout(function(){ b.textContent = 'Copy'; }, 2000);
                })(this)">Copy</button>
        <a href="<?= e($uploaderUrl) ?>" target="_blank" class="btn btn-default btn-sm">Open</a>
    </div>
    <p class="help-block">Give this link to people you want to upload files here. If the form is restricted, append <code>?user=&lt;token&gt;</code> for a specific user (see the Users tab).</p>
</div>

    <p class="help-block">Save the form once to generate the uploader link.</p>
<?php endif; ?>
