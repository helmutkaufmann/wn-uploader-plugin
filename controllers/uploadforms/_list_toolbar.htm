<div data-control="toolbar">
    <a
        href="<?= Backend::url('mercator/uploader/uploadforms/create') ?>"
        class="btn btn-primary wn-icon-plus">
        New Upload Form
    </a>

    <button
        type="button"
        class="btn btn-danger wn-icon-trash"
        disabled="disabled"
        onclick="
            if (!confirm('Delete all selected upload forms? This cannot be undone.')) return;
            var keepFiles = !confirm('Also permanently delete the uploaded files from disk?\n\nOK = delete the files\nCancel = keep the files, only delete the forms');
            $(this).request('onBulkDelete', {
                data: {
                    checked: $('.control-list').listWidget('getChecked'),
                    keepFiles: keepFiles ? 1 : 0
                }
            })
        "
        data-trigger-action="enable"
        data-trigger=".control-list input[type=checkbox]"
        data-trigger-condition="checked"
        data-stripe-load-indicator
    >
        Delete selected
    </button>

    <button
        type="button"
        class="btn btn-secondary wn-icon-refresh"
        data-request="onRefresh">
        Refresh
    </button>
    
</div>
