<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>{{ uploaderForm(id).title }} — Review &amp; Delete</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
    </head>

    <body class="uk-container uk-margin">
        {# UIKit #}
        <script defer src="https://cdn.jsdelivr.net/npm/uikit@3.24.1/dist/js/uikit.min.js"></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uikit@3.24.1/dist/css/uikit.min.css" />

        {% set form = uploaderForm(id) %}
        <div class="uk-card uk-card-default uk-card-body uk-margin">
            <div class="uk-card-title">{{ form.title }} — Review &amp; delete uploads</div>
            <p class="uk-text-meta">Only you have this link. Deleted files cannot be recovered.</p>

            {% include 'mercator.uploader::galleryGrid' with {
                formID: id,
                userID: 'NONE',
                ownerMode: true,
                ownerToken: owner
            } %}
        </div>
    </body>
</html>
